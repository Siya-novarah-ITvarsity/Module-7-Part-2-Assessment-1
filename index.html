    <script>
        document.getElementById("start").addEventListener("click",startTimer);
        document.getElementById("cancel").addEventListener("click",cancelledButtonPressed);

        let startTime;
        let endTime;
        let origTimePeriod;
        let newTimePeriod;
        let timer;
        let cancelled = false;

        function startTimer(){
            clearInterval(timer);
            cancelled = false;
            startTime = new Date();
            endTime = getEndTime();

            origTimePeriod = endTime.getTime() - startTime.getTime();
            newTimePeriod = origTimePeriod;

            displayCountdown();
            if (newTimePeriod > 0 && !cancelled){ 
                timer = setInterval(displayCountdown, 1000);
            }
        }

        function displayCountdown(){
            newTimePeriod = Math.max(0, endTime.getTime() - Date.now());
            let timeLeft = msToTime(newTimePeriod);
            document.getElementById("clock").innerHTML='<p>' + timeLeft['Hours'] + ':' + timeLeft['Minutes'] + ':' + timeLeft['Seconds'] + '</p>';

            let progress = origTimePeriod > 0 ? newTimePeriod / origTimePeriod : 0;
            let newHeight = Math.max(0, Math.min(300, progress * 300));
            document.getElementById("progressBar").setAttribute("height", newHeight);

            if(newTimePeriod === 0){
                clearInterval(timer);
                document.getElementById("clock").innerHTML='<p>Time is up!</p>';
            }
        }
        function cancelledButtonPressed(){
            cancelled = true;
            clearInterval(timer);
            timer = null;
            document.getElementById("clock").innerHTML = "<p>Cancelled</p>";
        }

        function msToTime(milliseconds){
            let totalSeconds = Math.ceil(Math.max(0, milliseconds) / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            let time =[]
            time['Hours'] = hours;
            time['Minutes'] = minutes;  
            time['Seconds'] = seconds;

            return time;
        }

        function getEndTime(){
            let dt = new Date();

            let hours = parseInt(document.getElementById('hours').value);
            let minutes = parseInt(document.getElementById('minutes').value);
            let seconds = parseInt(document.getElementById('seconds').value);

            dt.setHours(dt.getHours() + hours);
            dt.setMinutes(dt.getMinutes() + minutes);
            dt.setSeconds(dt.getSeconds() + seconds);
            return dt;
        }
